# ==== MEMORIA (24 GB RAM) ====
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.daemon=true

# ==== ANDROIDX / HERRAMIENTAS ====
android.useAndroidX=true
android.enableJetifier=true
REACT_NATIVE_DEV_SERVER_PORT=8081
android.suppressUnsupportedCompileSdk=35

# ==== ABIs (usaremos tu emulador x86_64) ====
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

# ==== RN flags ====
newArchEnabled=false
hermesEnabled=true
